[build-system]
requires = ["flit_core>=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "publish-helper"
version = "2.0.0"
description = "A comprehensive PT (Private Tracker) resource publishing assistant with modern Python architecture"
readme = "README_NEW.md"
license = {file = "LICENSE"}
authors = [
    {name = "bjdbjd", email = ""},
]
contributors = [
    {name = "Pixel-LH"},
    {name = "EasonWong0603"},
    {name = "sertion1126"},
    {name = "TommyMerlin"},
]
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.1.3",
    "flask-cors>=6.0.5",
    "Werkzeug>=3.1.9",
    "PyQt6>=6.11.0",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
    "certifi>=2026.10.23",
    "pillow>=13.0.0",
    "numpy>=2.5.4",
    "opencv-python>=4.14.0.94",
    "pymediainfo>=7.0.1",
    "torf>=4.3.1",
    "pyperclip>=1.11.0",
    "python-dotenv>=1.2.4",
    "pypinyin>=0.55.0",
    "click>=8.5.0",
    "colorama>=0.4.6",
    "prompt_toolkit>=3.0.53",
    "Jinja2>=3.1.6",
    "MarkupSafe>=3.0.4",
]
keywords = ["pt", "torrent", "media", "publishing", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia",
    "Topic :: Internet",
]

[project.urls]
Homepage = "https://github.com/bjdbjd/publish-helper"
Repository = "https://github.com/bjdbjd/publish-helper.git"
Issues = "https://github.com/bjdbjd/publish-helper/issues"
Documentation = "https://github.com/bjdbjd/publish-helper/wiki"

[project.scripts]
publish-helper-gui = "src.main_gui_new:main"
publish-helper-api = "src.main_api_new:main"

[project.optional-dependencies]
dev = [
    "black>=23.12.0",
    "isort>=5.13.1",
    "flake8>=5.0.4",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "coverage>=7.2.7",
]
docs = [
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=2.0.0",
]
security = [
    "bandit>=1.7.5",
    "safety>=3.0.0",
]

[tool.flit.module]
name = "src"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
known_first_party = ["src"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
